name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1.0.4
        id: auth

      # Whole workspace: the core's astropy parity vectors are the
      # correctness gate for both crates.
      - run: cargo test --workspace

      # The client depends on the core, so the core has to be on crates.io
      # before the client's version requirement can resolve.
      - run: cargo publish -p tart-catalogue-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: cargo publish -p tart-catalogue-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
